name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't queue stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bids
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bids"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bids?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BIDS_PAYMENT_MODE: demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs `prisma generate`
      - name: Install dependencies
        run: npm ci

      - name: Apply recorded database migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Block high and critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Verify worker shutdown and delivery draining
        run: npm run test:worker

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: node scripts/check-bundle-budget.mjs

  e2e:
    name: E2E (Playwright)
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bids
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bids"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bids?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BIDS_PAYMENT_MODE: demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs `prisma generate`
      - name: Install dependencies
        run: npm ci

      - name: Apply recorded database migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

  settlement:
    name: Contracts and persistent settlement recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: bids_design
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 56187:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bids_design"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:56187/bids_design?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BIDS_PAYMENT_MODE: demo
      BIDS_CHAIN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run contracts:build
      - run: git diff --exit-code -- contracts/artifacts
      - run: npm run test:contracts
      - run: npm run test:testnet-state
      - run: npx vitest run lib/__tests__/settlement-integration.test.ts
      - name: Verify product recovery against PostgreSQL
        run: npx vitest run lib/__tests__/product-operations-integration.test.ts
        env:
          BIDS_PRODUCT_TEST: "1"
      - name: Build stablecoin product
        run: npm run build
        env:
          NEXT_PUBLIC_BIDS_PAYMENT_MODE: crypto
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install payment journey browser
        run: npx playwright install --with-deps chromium
      - name: Exercise funded buyer and seller journey
        run: npm run test:settlement-ui
        env:
          NEXT_PUBLIC_BIDS_PAYMENT_MODE: crypto
      - name: Preserve settlement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settlement-browser-evidence
          path: test-results/settlement-ui
          if-no-files-found: ignore

  scale:
    name: 10,000-account data and concurrency regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bids_scale
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bids_scale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bids_scale
      NEXT_PUBLIC_BIDS_PAYMENT_MODE: demo
      BIDS_SCALE_TEST: "1"
      BIDS_SCALE_REPORT: product-scale-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx vitest run lib/__tests__/product-scale.test.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-scale-results
          path: product-scale-results.json
